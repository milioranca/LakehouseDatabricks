# This is a Declarative Automation Bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: 40e6e035-a1e6-471d-b62f-693c8913c707

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-600176b6-b4d5.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-600176b6-b4d5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/carmensandiegocoelho@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/carmensandiegocoelho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: carmensandiegocoelho@gmail.com
        level: CAN_MANAGE
